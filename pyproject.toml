[project]
name = "finetuning-slm"
version = "0.1.0"
description = "Comprehensive SLM fine-tuning tutorial — from basics to advanced techniques on Apple Silicon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Kumarjit Pathak" }
]

dependencies = [
    # ── Core ML / Training ──
    "torch>=2.12.0",
    "transformers>=5.12.0",
    "peft>=0.19.0",
    "trl>=1.6.0",
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "datasets>=5.0.0",
    "safetensors>=0.8.0",
    "tokenizers>=0.22.0",

    # ── Evaluation ──
    "evaluate>=0.4.6",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.12",
    "scikit-learn>=1.9.0",

    # ── Visualization ──
    "matplotlib>=3.11.0",
    "plotly>=6.0.0",
    "seaborn>=0.13.2",

    # ── Utilities ──
    "rich>=15.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "pydantic>=2.13.0",

    # ── GGUF / llama.cpp fallback (for QLoRA Apple Silicon issues) ──
    "llama-cpp-python>=0.3.31",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.0",
    "pytest>=9.1.0",
    "ruff>=0.15.0",
]

# Optional: MLX for Apple Silicon native fine-tuning comparison (notebook 19)
mlx = [
    "mlx>=0.22.0",
    "mlx-lm>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
