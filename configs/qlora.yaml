# QLoRA Fine-Tuning Configuration
model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  torch_dtype: "float16"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  num_epochs: 3
  learning_rate: 2.0e-4
  batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.1
  lr_scheduler: "cosine"
  max_seq_length: 512

low_resource:
  model_name: "HuggingFaceTB/SmolLM2-360M-Instruct"  # Fallback for 6GB
  batch_size: 1
  gradient_accumulation_steps: 16
  max_seq_length: 256
