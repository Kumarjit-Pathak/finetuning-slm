<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="merge-title merge-desc">
  <title id="merge-title">Model merging: SLERP, TIES, and DARE</title>
  <desc id="merge-desc">Three panels showing three model-merging strategies. SLERP interpolates two weight vectors on a sphere. TIES trims small deltas, elects a sign per parameter, and merges only within the agreeing subset. DARE randomly drops most parameter deltas and rescales the survivors.</desc>

  <defs>
    <marker id="mv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .lbl        { font: 500 12px 'Inter', system-ui, sans-serif; fill: #0f172a; }
    .lbl-small  { font: 500 10px 'Inter', system-ui, sans-serif; fill: #475569; }
    .lbl-header { font: 700 16px 'Inter', system-ui, sans-serif; letter-spacing: -0.02em; fill: #0f172a; }
    .lbl-title  { font: 700 14px 'Inter', system-ui, sans-serif; fill: #0f172a; }
    .lbl-math   { font: italic 500 11px 'JetBrains Mono', monospace; fill: #475569; }
    .lbl-caption{ font: 600 10px 'Inter', system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; fill: #475569; }
    [data-theme="dark"] .lbl,
    [data-theme="dark"] .lbl-header,
    [data-theme="dark"] .lbl-title { fill: #f1f5f9; }
    [data-theme="dark"] .lbl-small,
    [data-theme="dark"] .lbl-math,
    [data-theme="dark"] .lbl-caption { fill: #cbd5e1; }
  </style>

  <text x="450" y="26" class="lbl-header" text-anchor="middle">Three ways to combine fine-tuned models without training</text>

  <!-- =====================================================
       Panel 1: SLERP
       ===================================================== -->
  <text x="150" y="65" class="lbl-title" text-anchor="middle" fill="#3b82f6">SLERP</text>
  <text x="150" y="82" class="lbl-caption" text-anchor="middle">Interpolate on a sphere</text>

  <!-- Sphere arc -->
  <circle cx="150" cy="200" r="90" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Vector 1 -->
  <line x1="150" y1="200" x2="90" y2="130" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#mv-arrow)"/>
  <text x="70" y="120" class="lbl" text-anchor="middle" fill="#3b82f6" font-weight="700">&#952;&#8321;</text>

  <!-- Vector 2 -->
  <line x1="150" y1="200" x2="230" y2="140" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#mv-arrow)"/>
  <text x="242" y="130" class="lbl" fill="#8b5cf6" font-weight="700">&#952;&#8322;</text>

  <!-- Interpolated vector (green) on the arc -->
  <line x1="150" y1="200" x2="150" y2="110" stroke="#10b981" stroke-width="2.5" marker-end="url(#mv-arrow)"/>
  <text x="150" y="98" class="lbl" text-anchor="middle" fill="#10b981" font-weight="700">&#952;_merged</text>

  <!-- Angle omega -->
  <path d="M 105 170 A 45 45 0 0 1 195 170" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="150" y="185" class="lbl-small" text-anchor="middle">&#8486;</text>

  <!-- Formula -->
  <rect x="55" y="305" width="190" height="55" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="150" y="325" class="lbl-math" text-anchor="middle">&#952;_m = sin((1&#8722;t)&#8486;)/sin&#8486; &#183; &#952;&#8321;</text>
  <text x="150" y="342" class="lbl-math" text-anchor="middle">+ sin(t&#8486;)/sin&#8486; &#183; &#952;&#8322;</text>

  <!-- Caption -->
  <text x="150" y="380" class="lbl-small" text-anchor="middle">Preserves the geometry.</text>
  <text x="150" y="395" class="lbl-small" text-anchor="middle">Best when models are similar.</text>

  <!-- Divider 1 -->
  <line x1="300" y1="55" x2="300" y2="410" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- =====================================================
       Panel 2: TIES
       ===================================================== -->
  <text x="450" y="65" class="lbl-title" text-anchor="middle" fill="#f59e0b">TIES</text>
  <text x="450" y="82" class="lbl-caption" text-anchor="middle">Trim, Elect Sign, Merge</text>

  <!-- Step 1: parameter delta vectors (grouped bars) -->
  <text x="340" y="110" class="lbl-small">Task A delta:</text>
  <g transform="translate(415, 100)">
    <rect x="0" y="0" width="12" height="14" fill="#f59e0b"/>
    <rect x="14" y="4" width="12" height="10" fill="#fbbf24" opacity=".4"/>
    <rect x="28" y="0" width="12" height="14" fill="#f59e0b"/>
    <rect x="42" y="6" width="12" height="8" fill="#fbbf24" opacity=".4"/>
    <rect x="56" y="0" width="12" height="14" fill="#f59e0b"/>
    <rect x="70" y="4" width="12" height="10" fill="#fbbf24" opacity=".4"/>
    <rect x="84" y="0" width="12" height="14" fill="#f59e0b"/>
  </g>

  <text x="340" y="140" class="lbl-small">Task B delta:</text>
  <g transform="translate(415, 130)">
    <rect x="0" y="4" width="12" height="10" fill="#fbbf24" opacity=".4"/>
    <rect x="14" y="0" width="12" height="14" fill="#f59e0b"/>
    <rect x="28" y="0" width="12" height="14" fill="#f59e0b"/>
    <rect x="42" y="0" width="12" height="14" fill="#f59e0b"/>
    <rect x="56" y="6" width="12" height="8" fill="#fbbf24" opacity=".4"/>
    <rect x="70" y="0" width="12" height="14" fill="#f59e0b"/>
    <rect x="84" y="4" width="12" height="10" fill="#fbbf24" opacity=".4"/>
  </g>

  <!-- Step 2: trim -->
  <text x="340" y="180" class="lbl-caption" fill="#f59e0b">Step 1: Trim</text>
  <text x="340" y="195" class="lbl-small">Drop small deltas.</text>

  <text x="340" y="215" class="lbl-caption" fill="#f59e0b">Step 2: Elect sign</text>
  <text x="340" y="230" class="lbl-small">Sign vote per parameter.</text>

  <text x="340" y="250" class="lbl-caption" fill="#f59e0b">Step 3: Merge in agreeing subset</text>

  <!-- Result -->
  <text x="340" y="290" class="lbl-small">Merged delta:</text>
  <g transform="translate(415, 280)">
    <rect x="0" y="0" width="12" height="14" fill="#10b981"/>
    <rect x="14" y="0" width="12" height="14" fill="#10b981"/>
    <rect x="28" y="0" width="12" height="14" fill="#10b981"/>
    <rect x="42" y="0" width="12" height="14" fill="#10b981"/>
    <rect x="56" y="0" width="12" height="14" fill="#10b981"/>
    <rect x="70" y="0" width="12" height="14" fill="#10b981"/>
    <rect x="84" y="0" width="12" height="14" fill="#10b981"/>
  </g>

  <!-- Formula-ish -->
  <rect x="355" y="315" width="190" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="450" y="335" class="lbl-math" text-anchor="middle">merge(sign(&#8721;&#916;)) &#8712; agreeing_subset</text>
  <text x="450" y="352" class="lbl-small" text-anchor="middle">Reduces cross-task interference.</text>

  <text x="450" y="380" class="lbl-small" text-anchor="middle">Best when tasks might conflict.</text>
  <text x="450" y="395" class="lbl-small" text-anchor="middle">Preserves what both agree on.</text>

  <!-- Divider 2 -->
  <line x1="600" y1="55" x2="600" y2="410" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- =====================================================
       Panel 3: DARE
       ===================================================== -->
  <text x="750" y="65" class="lbl-title" text-anchor="middle" fill="#8b5cf6">DARE</text>
  <text x="750" y="82" class="lbl-caption" text-anchor="middle">Drop And REscale</text>

  <!-- Input delta bars -->
  <text x="640" y="115" class="lbl-small">Task delta &#916;:</text>
  <g transform="translate(720, 105)">
    <rect x="0" y="0" width="10" height="14" fill="#8b5cf6"/>
    <rect x="12" y="0" width="10" height="14" fill="#8b5cf6"/>
    <rect x="24" y="0" width="10" height="14" fill="#8b5cf6"/>
    <rect x="36" y="0" width="10" height="14" fill="#8b5cf6"/>
    <rect x="48" y="0" width="10" height="14" fill="#8b5cf6"/>
    <rect x="60" y="0" width="10" height="14" fill="#8b5cf6"/>
    <rect x="72" y="0" width="10" height="14" fill="#8b5cf6"/>
    <rect x="84" y="0" width="10" height="14" fill="#8b5cf6"/>
  </g>

  <!-- Drop step -->
  <text x="640" y="150" class="lbl-caption" fill="#8b5cf6">Step 1: Randomly zero (say 90%)</text>
  <g transform="translate(720, 160)">
    <rect x="0" y="0" width="10" height="14" fill="#cbd5e1"/>
    <rect x="12" y="0" width="10" height="14" fill="#cbd5e1"/>
    <rect x="24" y="0" width="10" height="14" fill="#8b5cf6"/>
    <rect x="36" y="0" width="10" height="14" fill="#cbd5e1"/>
    <rect x="48" y="0" width="10" height="14" fill="#cbd5e1"/>
    <rect x="60" y="0" width="10" height="14" fill="#cbd5e1"/>
    <rect x="72" y="0" width="10" height="14" fill="#8b5cf6"/>
    <rect x="84" y="0" width="10" height="14" fill="#cbd5e1"/>
  </g>

  <!-- Rescale step -->
  <text x="640" y="205" class="lbl-caption" fill="#8b5cf6">Step 2: Rescale survivors by 1/(1&#8722;p)</text>
  <g transform="translate(720, 215)">
    <rect x="0" y="0" width="10" height="14" fill="#cbd5e1"/>
    <rect x="12" y="0" width="10" height="14" fill="#cbd5e1"/>
    <rect x="24" y="-10" width="10" height="24" fill="#8b5cf6"/>
    <rect x="36" y="0" width="10" height="14" fill="#cbd5e1"/>
    <rect x="48" y="0" width="10" height="14" fill="#cbd5e1"/>
    <rect x="60" y="0" width="10" height="14" fill="#cbd5e1"/>
    <rect x="72" y="-10" width="10" height="24" fill="#8b5cf6"/>
    <rect x="84" y="0" width="10" height="14" fill="#cbd5e1"/>
  </g>

  <!-- Merge across all tasks -->
  <text x="750" y="265" class="lbl-caption" text-anchor="middle" fill="#8b5cf6">Then merge across tasks</text>

  <!-- Formula -->
  <rect x="655" y="285" width="190" height="55" rx="6" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="750" y="305" class="lbl-math" text-anchor="middle">&#916;' = Bernoulli(1&#8722;p) &#8857; &#916;</text>
  <text x="750" y="322" class="lbl-math" text-anchor="middle">&#916;'&#8592; &#916;' / (1&#8722;p)</text>

  <text x="750" y="370" class="lbl-small" text-anchor="middle">Aggressive but effective at</text>
  <text x="750" y="385" class="lbl-small" text-anchor="middle">reducing task interference.</text>
</svg>
