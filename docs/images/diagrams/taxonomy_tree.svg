<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="tax-title tax-desc">
  <title id="tax-title">Taxonomy of fine-tuning techniques</title>
  <desc id="tax-desc">A tree diagram grouping fine-tuning techniques into families. The root is "Fine-tuning", branching into Full FT, Head-only (Linear Probing), Parameter-Efficient (LoRA, DoRA, QLoRA), Prompt-based (Prompt tuning, Prefix tuning), Alignment (DPO), Compression (Distillation), and Composition (Model merging).</desc>

  <defs>
    <linearGradient id="root-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="peft-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="tri-tax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .lbl        { font: 600 13px 'Inter', system-ui, sans-serif; fill: #0f172a; }
    .lbl-small  { font: 500 11px 'Inter', system-ui, sans-serif; fill: #475569; }
    .lbl-white  { font: 700 14px 'Inter', system-ui, sans-serif; fill: #ffffff; }
    .lbl-fam    { font: 700 11px 'Inter', system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
    .link-line  { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
    [data-theme="dark"] .lbl        { fill: #f1f5f9; }
    [data-theme="dark"] .lbl-small  { fill: #cbd5e1; }
    [data-theme="dark"] .link-line  { stroke: #64748b; }
  </style>

  <!-- Root node -->
  <rect x="380" y="20" width="140" height="46" rx="8" fill="url(#root-grad)"/>
  <text x="450" y="49" class="lbl-white" text-anchor="middle">Fine-tuning</text>

  <!-- Level 1 branches -->
  <!-- 6 families spaced across x-axis -->
  <!-- Full FT -->
  <path d="M 450 66 Q 450 100 90 130 L 90 150" class="link-line" marker-end="url(#tri-tax)"/>
  <rect x="20" y="150" width="140" height="36" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="90" y="173" class="lbl" text-anchor="middle">Full fine-tuning</text>
  <text x="90" y="200" class="lbl-fam" fill="#ef4444" text-anchor="middle">Brute force</text>
  <rect x="35" y="215" width="110" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="90" y="232" class="lbl-small" text-anchor="middle">Notebook 02</text>

  <!-- Head only -->
  <path d="M 450 66 Q 450 100 230 130 L 230 150" class="link-line" marker-end="url(#tri-tax)"/>
  <rect x="180" y="150" width="140" height="36" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="250" y="173" class="lbl" text-anchor="middle">Linear probing</text>
  <text x="250" y="200" class="lbl-fam" fill="#64748b" text-anchor="middle">Head only</text>
  <rect x="195" y="215" width="110" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="250" y="232" class="lbl-small" text-anchor="middle">Notebook 03</text>

  <!-- PEFT (biggest branch) -->
  <path d="M 450 66 Q 450 100 450 130 L 450 150" class="link-line" marker-end="url(#tri-tax)"/>
  <rect x="380" y="150" width="140" height="36" rx="6" fill="url(#peft-grad)"/>
  <text x="450" y="173" class="lbl-white" text-anchor="middle">PEFT</text>
  <text x="450" y="200" class="lbl-fam" fill="#8b5cf6" text-anchor="middle">Parameter-efficient</text>

  <!-- PEFT children: LoRA, DoRA, QLoRA -->
  <path d="M 450 186 L 450 220" class="link-line"/>
  <path d="M 450 220 L 355 220" class="link-line"/>
  <path d="M 450 220 L 545 220" class="link-line"/>
  <path d="M 355 220 L 355 240" class="link-line" marker-end="url(#tri-tax)"/>
  <path d="M 450 220 L 450 240" class="link-line" marker-end="url(#tri-tax)"/>
  <path d="M 545 220 L 545 240" class="link-line" marker-end="url(#tri-tax)"/>
  <!-- LoRA -->
  <rect x="315" y="242" width="80" height="30" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="355" y="261" class="lbl" text-anchor="middle">LoRA</text>
  <text x="355" y="290" class="lbl-small" text-anchor="middle">nb 04</text>
  <!-- DoRA -->
  <rect x="410" y="242" width="80" height="30" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="450" y="261" class="lbl" text-anchor="middle">DoRA</text>
  <text x="450" y="290" class="lbl-small" text-anchor="middle">nb 04</text>
  <!-- QLoRA -->
  <rect x="505" y="242" width="80" height="30" rx="5" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="545" y="261" class="lbl" text-anchor="middle">QLoRA</text>
  <text x="545" y="290" class="lbl-small" text-anchor="middle">nb 05</text>

  <!-- Prompt family -->
  <path d="M 450 66 Q 450 100 670 130 L 670 150" class="link-line" marker-end="url(#tri-tax)"/>
  <rect x="600" y="150" width="140" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="670" y="173" class="lbl" text-anchor="middle">Prompt-based</text>
  <text x="670" y="200" class="lbl-fam" fill="#f59e0b" text-anchor="middle">Soft prompts</text>
  <!-- children -->
  <path d="M 670 186 L 670 220" class="link-line"/>
  <path d="M 670 220 L 620 220" class="link-line"/>
  <path d="M 670 220 L 720 220" class="link-line"/>
  <path d="M 620 220 L 620 240" class="link-line" marker-end="url(#tri-tax)"/>
  <path d="M 720 220 L 720 240" class="link-line" marker-end="url(#tri-tax)"/>
  <rect x="580" y="242" width="80" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="620" y="261" class="lbl" text-anchor="middle">Prompt</text>
  <text x="620" y="290" class="lbl-small" text-anchor="middle">nb 06</text>
  <rect x="680" y="242" width="80" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="720" y="261" class="lbl" text-anchor="middle">Prefix</text>
  <text x="720" y="290" class="lbl-small" text-anchor="middle">nb 07</text>

  <!-- Advanced branches (level 1 continued below) -->
  <!-- Alignment -->
  <path d="M 450 66 Q 450 340 130 340 L 130 360" class="link-line" marker-end="url(#tri-tax)"/>
  <rect x="60" y="360" width="140" height="36" rx="6" fill="#dcfce7" stroke="#10b981"/>
  <text x="130" y="383" class="lbl" text-anchor="middle">DPO</text>
  <text x="130" y="410" class="lbl-fam" fill="#10b981" text-anchor="middle">Alignment</text>
  <rect x="75" y="425" width="110" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="130" y="442" class="lbl-small" text-anchor="middle">Notebook 08</text>

  <!-- Distillation -->
  <path d="M 450 66 Q 450 340 320 340 L 320 360" class="link-line" marker-end="url(#tri-tax)"/>
  <rect x="250" y="360" width="140" height="36" rx="6" fill="#dcfce7" stroke="#10b981"/>
  <text x="320" y="383" class="lbl" text-anchor="middle">Distillation</text>
  <text x="320" y="410" class="lbl-fam" fill="#10b981" text-anchor="middle">Compression</text>
  <rect x="265" y="425" width="110" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="320" y="442" class="lbl-small" text-anchor="middle">Notebook 09</text>

  <!-- Merging -->
  <path d="M 450 66 Q 450 340 570 340 L 570 360" class="link-line" marker-end="url(#tri-tax)"/>
  <rect x="500" y="360" width="140" height="36" rx="6" fill="#dcfce7" stroke="#10b981"/>
  <text x="570" y="383" class="lbl" text-anchor="middle">Model merging</text>
  <text x="570" y="410" class="lbl-fam" fill="#10b981" text-anchor="middle">Composition</text>
  <rect x="515" y="425" width="110" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="570" y="442" class="lbl-small" text-anchor="middle">Notebook 10</text>

  <!-- Legend on the right -->
  <text x="700" y="360" class="lbl-fam" fill="#475569">Legend</text>
  <rect x="700" y="368" width="12" height="12" rx="2" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="720" y="378" class="lbl-small">PEFT (adapter-based)</text>
  <rect x="700" y="386" width="12" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="720" y="396" class="lbl-small">Prompt-based (input-side)</text>
  <rect x="700" y="404" width="12" height="12" rx="2" fill="#dcfce7" stroke="#10b981"/>
  <text x="720" y="414" class="lbl-small">Advanced (align / compress / compose)</text>
  <rect x="700" y="422" width="12" height="12" rx="2" fill="#fee2e2" stroke="#ef4444"/>
  <text x="720" y="432" class="lbl-small">Brute force (all params)</text>
  <rect x="700" y="440" width="12" height="12" rx="2" fill="#f1f5f9" stroke="#64748b"/>
  <text x="720" y="450" class="lbl-small">Head only (frozen base)</text>
</svg>
