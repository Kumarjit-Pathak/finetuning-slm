<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Peak GPU Memory Usage Comparison for Fine-Tuning SmolLM2-135M</title>
  <desc id="chart-desc">Horizontal bar chart comparing peak GPU memory usage across seven fine-tuning techniques. QLoRA uses the least memory at 0.5 GB while Full Fine-Tuning uses the most at 2.1 GB.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1e293b; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" fill="#ffffff" rx="8"/>

  <!-- Chart Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700">Peak GPU Memory Usage — SmolLM2-135M Fine-Tuning</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#64748b">Lower is better · Measured during training with batch size 4</text>

  <!-- Chart area: x=180, y=70, width=560, height=320 -->
  <!-- X-axis scale: 0 to 16 GB, so 1 GB = 560/16 = 35px -->

  <!-- Grid lines -->
  <line x1="180" y1="70" x2="180" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="285" y1="70" x2="285" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="390" y1="70" x2="390" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="495" y1="70" x2="495" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="600" y1="70" x2="600" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="705" y1="70" x2="705" y2="390" stroke="#e2e8f0" stroke-width="1"/>

  <!-- X-axis labels (0, 3, 6, 9, 12, 15 GB) -->
  <text x="180" y="410" text-anchor="middle" font-size="11" fill="#64748b">0</text>
  <text x="285" y="410" text-anchor="middle" font-size="11" fill="#64748b">3 GB</text>
  <text x="390" y="410" text-anchor="middle" font-size="11" fill="#64748b">6 GB</text>
  <text x="495" y="410" text-anchor="middle" font-size="11" fill="#64748b">9 GB</text>
  <text x="600" y="410" text-anchor="middle" font-size="11" fill="#64748b">12 GB</text>
  <text x="705" y="410" text-anchor="middle" font-size="11" fill="#64748b">15 GB</text>

  <!-- X-axis title -->
  <text x="460" y="438" text-anchor="middle" font-size="12" fill="#64748b">Peak GPU Memory (GB)</text>

  <!-- Reference limit lines -->
  <!-- 6GB GPU limit: x = 180 + (6/16)*560 = 180 + 210 = 390 -->
  <line x1="390" y1="70" x2="390" y2="390" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="392" y="84" font-size="11" fill="#ef4444" font-weight="600">6 GB GPU limit</text>

  <!-- 15GB Colab T4 limit: x = 180 + (15/16)*560 = 180 + 525 = 705 -->
  <line x1="705" y1="70" x2="705" y2="390" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="707" y="84" font-size="11" fill="#ef4444" font-weight="600">Colab T4 (15 GB)</text>

  <!-- Bars: 7 bars, chart height 320px, bar spacing: 320/7 ≈ 45.7px per row, bar height 30px -->
  <!-- Row centers: 70 + 22.8, 70 + 68.5, 70 + 114.3, 70 + 160, 70 + 205.7, 70 + 251.4, 70 + 297.1 -->

  <!-- Bar 1: Full Fine-Tuning — 2.1 GB, width = (2.1/16)*560 = 73.5 -->
  <rect x="180" y="80" width="73.5" height="30" fill="#dc2626" rx="4" opacity="0.9"/>
  <text x="175" y="100" text-anchor="end" font-size="13" font-weight="500">Full Fine-Tuning</text>
  <text x="259" y="100" font-size="12" font-weight="600" fill="#1e293b">2.1 GB</text>

  <!-- Bar 2: DoRA (r=16) — 0.85 GB, width = (0.85/16)*560 = 29.75 -->
  <rect x="180" y="125" width="29.75" height="30" fill="#7c3aed" rx="4" opacity="0.9"/>
  <text x="175" y="145" text-anchor="end" font-size="13" font-weight="500">DoRA (r=16)</text>
  <text x="215" y="145" font-size="12" font-weight="600" fill="#1e293b">0.85 GB</text>

  <!-- Bar 3: LoRA (r=16) — 0.8 GB, width = (0.8/16)*560 = 28 -->
  <rect x="180" y="170" width="28" height="30" fill="#2563eb" rx="4" opacity="0.9"/>
  <text x="175" y="190" text-anchor="end" font-size="13" font-weight="500">LoRA (r=16)</text>
  <text x="213" y="190" font-size="12" font-weight="600" fill="#1e293b">0.8 GB</text>

  <!-- Bar 4: Feature Extraction — 0.7 GB, width = (0.7/16)*560 = 24.5 -->
  <rect x="180" y="215" width="24.5" height="30" fill="#6366f1" rx="4" opacity="0.9"/>
  <text x="175" y="235" text-anchor="end" font-size="13" font-weight="500">Feature Extraction</text>
  <text x="210" y="235" font-size="12" font-weight="600" fill="#1e293b">0.7 GB</text>

  <!-- Bar 5: Prefix Tuning — 0.65 GB, width = (0.65/16)*560 = 22.75 -->
  <rect x="180" y="260" width="22.75" height="30" fill="#0891b2" rx="4" opacity="0.9"/>
  <text x="175" y="280" text-anchor="end" font-size="13" font-weight="500">Prefix Tuning</text>
  <text x="208" y="280" font-size="12" font-weight="600" fill="#1e293b">0.65 GB</text>

  <!-- Bar 6: Prompt Tuning — 0.6 GB, width = (0.6/16)*560 = 21 -->
  <rect x="180" y="305" width="21" height="30" fill="#d97706" rx="4" opacity="0.9"/>
  <text x="175" y="325" text-anchor="end" font-size="13" font-weight="500">Prompt Tuning</text>
  <text x="206" y="325" font-size="12" font-weight="600" fill="#1e293b">0.6 GB</text>

  <!-- Bar 7: QLoRA (4-bit) — 0.5 GB, width = (0.5/16)*560 = 17.5 -->
  <rect x="180" y="350" width="17.5" height="30" fill="#16a34a" rx="4" opacity="0.9"/>
  <text x="175" y="370" text-anchor="end" font-size="13" font-weight="500">QLoRA (4-bit)</text>
  <text x="203" y="370" font-size="12" font-weight="600" fill="#1e293b">0.5 GB</text>

  <!-- Savings annotation -->
  <text x="180" y="430" font-size="11" fill="#16a34a" font-weight="600">✓ QLoRA saves ~76% memory vs Full Fine-Tuning</text>
</svg>
